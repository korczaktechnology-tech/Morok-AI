services:
  - type: web
    name: morok-api
    runtime: node
    plan: free
    buildCommand: npm install --workspaces --include=dev --no-audit --no-fund --prefer-offline && npm run build --workspace=@morok/api
    startCommand: npm run start --workspace=@morok/api
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - .nvmrc
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: MorokAI
      - key: MODEL_API_URL
        value: https://morok-ollama.onrender.com/v1
      - key: MODEL_API_USERNAME
        value: morok
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_NAME
        value: qwen2.5:0.5b

  - type: web
    name: morok-ollama
    runtime: docker
    plan: free
    rootDir: apps/ollama
    dockerContext: apps/ollama
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/ollama/**
    envVars:
      - key: MODEL_PROXY_KEY
        sync: false
      - key: OLLAMA_HOST
        value: 0.0.0.0:11434
      - key: OLLAMA_MODELS
        value: /data/models
      - key: OLLAMA_NUM_PARALLEL
        value: "1"
      - key: OLLAMA_MAX_LOADED_MODELS
        value: "1"
      - key: OLLAMA_KEEP_ALIVE
        value: 5m
      - key: OLLAMA_CONTEXT_LENGTH
        value: "2048"
