name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/android-native/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Use project logo when available
        run: |
          if [ -f apps/client/public/MorokLogo.png ]; then
            rm -f apps/android-native/app/src/main/res/drawable/morok_logo.xml
            mkdir -p apps/android-native/app/src/main/res/drawable-nodpi
            cp apps/client/public/MorokLogo.png apps/android-native/app/src/main/res/drawable-nodpi/morok_logo.png
          fi

      - name: Build standalone native Android APK
        working-directory: apps/android-native
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Morok-Android-Native
          path: apps/android-native/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apps/android-native/app/build/outputs/apk/debug/app-debug.apk
