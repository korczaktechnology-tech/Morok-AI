name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build web client
        run: VITE_APP_VERSION=$(node -p "require('./apps/client/package.json').version") npm run build --workspace=@morok/client

      - name: Create Android project
        working-directory: apps/client
        run: npx cap add android

      - name: Configure Morok app icon
        working-directory: apps/client
        run: |
          if [ -f public/MorokLogo.png ]; then
            mkdir -p android/app/src/main/res/drawable-nodpi
            cp public/MorokLogo.png android/app/src/main/res/drawable-nodpi/morok_logo.png
            sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/morok_logo"|' android/app/src/main/AndroidManifest.xml
            sed -i 's|android:roundIcon="@mipmap/ic_launcher_round"|android:roundIcon="@drawable/morok_logo"|' android/app/src/main/AndroidManifest.xml
          else
            echo "MorokLogo.png not found; keeping Capacitor default icon."
          fi

      - name: Sync Capacitor
        working-directory: apps/client
        run: npx cap sync android

      - name: Build debug APK
        working-directory: apps/client/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Morok-Android-debug
          path: apps/client/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./apps/client/package.json').version")
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "apps/client/android/app/build/outputs/apk/debug/app-debug.apk#Morok-$TAG.apk" \
              --title "Morok $TAG" \
              --generate-notes
          else
            echo "Release $TAG already exists."
          fi
