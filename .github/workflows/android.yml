name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build web client
        run: VITE_APP_VERSION=$(node -p "require('./apps/client/package.json').version") npm run build --workspace=@morok/client

      - name: Create Android project
        working-directory: apps/client
        run: npx cap add android

      - name: Configure native automatic updater
        working-directory: apps/client
        run: |
          mkdir -p android/app/src/main/java/com/korczak/morok android/app/src/main/res/xml
          cat > android/app/src/main/java/com/korczak/morok/MainActivity.java <<'EOF'
          package com.korczak.morok;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle savedInstanceState) {
              registerPlugin(MorokUpdaterPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
          cat > android/app/src/main/java/com/korczak/morok/MorokUpdaterPlugin.java <<'EOF'
          package com.korczak.morok;

          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          @CapacitorPlugin(name = "MorokUpdater")
          public class MorokUpdaterPlugin extends Plugin {
            @PluginMethod
            public void installApk(PluginCall call) {
              String url = call.getString("url", "");
              if (url.isEmpty() || !(url.startsWith("https://github.com/") || url.startsWith("https://objects.githubusercontent.com/"))) {
                call.reject("Fonte de atualização não permitida.");
                return;
              }
              final Context context = getContext();
              final File dir = new File(context.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "updates");
              if (!dir.exists() && !dir.mkdirs()) {
                call.reject("Não foi possível criar a pasta de atualização.");
                return;
              }
              final File apk = new File(dir, "morok-update.apk");
              new Thread(() -> {
                try {
                  download(url, apk);
                  getActivity().runOnUiThread(() -> openInstaller(context, apk));
                  call.resolve();
                } catch (Exception e) {
                  call.reject("Falha ao baixar a atualização: " + e.getMessage());
                }
              }, "morok-updater").start();
            }

            private void download(String source, File destination) throws Exception {
              HttpURLConnection connection = (HttpURLConnection) new URL(source).openConnection();
              connection.setInstanceFollowRedirects(true);
              connection.setConnectTimeout(20000);
              connection.setReadTimeout(120000);
              connection.setRequestProperty("User-Agent", "Morok-Updater/1.0");
              connection.connect();
              if (connection.getResponseCode() < 200 || connection.getResponseCode() >= 300) {
                throw new Exception("HTTP " + connection.getResponseCode());
              }
              File partial = new File(destination.getAbsolutePath() + ".part");
              try (InputStream input = connection.getInputStream();
                   FileOutputStream output = new FileOutputStream(partial)) {
                byte[] buffer = new byte[65536];
                int read;
                while ((read = input.read(buffer)) != -1) {
                  output.write(buffer, 0, read);
                }
              } finally {
                connection.disconnect();
              }
              if (!partial.renameTo(destination)) {
                throw new Exception("Não foi possível finalizar o APK.");
              }
            }

            private void openInstaller(Context context, File apk) {
              try {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !context.getPackageManager().canRequestPackageInstalls()) {
                  Intent settings = new Intent(
                    Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                    Uri.parse("package:" + context.getPackageName())
                  );
                  settings.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  context.startActivity(settings);
                  return;
                }
                Uri uri = FileProvider.getUriForFile(
                  context,
                  context.getPackageName() + ".fileprovider",
                  apk
                );
                Intent intent = new Intent(Intent.ACTION_VIEW);
                intent.setDataAndType(uri, "application/vnd.android.package-archive");
                intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                context.startActivity(intent);
              } catch (Exception ignored) {}
            }
          }
          EOF

          cat > android/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
            <external-files-path name="updates" path="Download/updates/" />
          </paths>
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if permission not in s:
              s = s.replace("<application", permission + "\n\n    <application", 1)
          provider = '''        <provider
              android:name="androidx.core.content.FileProvider"
              android:authorities="com.korczak.morok.fileprovider"
              android:exported="false"
              android:grantUriPermissions="true">
              <meta-data
                  android:name="android.support.FILE_PROVIDER_PATHS"
                  android:resource="@xml/file_paths" />
          </provider>'''
          if "androidx.core.content.FileProvider" not in s:
              s = s.replace("</application>", provider + "\n    </application>", 1)
          p.write_text(s)
          PY

      - name: Configure Morok wake word and overlay
        run: |
          chmod +x apps/client/scripts/configure-android.sh
          apps/client/scripts/configure-android.sh

      - name: Configure Morok app icon
        working-directory: apps/client
        run: |
          if [ -f public/MorokLogo.png ]; then
            mkdir -p android/app/src/main/res/drawable-nodpi
            cp public/MorokLogo.png android/app/src/main/res/drawable-nodpi/morok_logo.png
            sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/morok_logo"|' android/app/src/main/AndroidManifest.xml
            sed -i 's|android:roundIcon="@mipmap/ic_launcher_round"|android:roundIcon="@drawable/morok_logo"|' android/app/src/main/AndroidManifest.xml
          else
            echo "MorokLogo.png not found; keeping Capacitor default icon."
          fi

      - name: Sync Capacitor
        working-directory: apps/client
        run: npx cap sync android

      - name: Build debug APK
        working-directory: apps/client/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.5
          name: Morok v0.1.5
          generate_release_notes: true
          files: apps/client/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Morok-Android-debug
          path: apps/client/android/app/build/outputs/apk/debug/app-debug.apk
