<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Morok — Debug</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:grid;place-items:center}
.viewport{width:100vw;height:100vh;display:grid;place-items:center;background:#000}
.viewport img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:#000}
.missing{display:none;color:#7f8aa8;font:12px/1.5 monospace;letter-spacing:.12em;text-align:center}
</style>
</head>
<body>
<main class="viewport">
<img src="./index.png" alt="Imagem de referência do Morok" onerror="this.style.display='none';document.querySelector('.missing').style.display='block'">
<div class="missing">INDEX.PNG NÃO ENCONTRADO</div>
</main>
<script>
window.addEventListener("keydown",e=>{
 if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="l"){
  e.preventDefault();e.stopPropagation();window.location.href="./";
 }
},true);
</script>
</body>
</html>
